<!DOCTYPE html>
<html lang="it" dir="ltr">
  <head>
    <link rel="stylesheet" href="style.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GMail - Posta in arrivo</title>
  </head>
  <body>
    <div class="container">
      <header>
        <!-- logo e testo -->
        <img class="logo" src="img/gmail (2).png" alt="Logo Gmail">
        <h1 class="logo-text">GMAIL</h1>
        <hr>
      </header>
      <section aria-label="Ricerca e riepilogo della posta">
        <!-- input e testo delle email non lette -->
        <input type="text" placeholder="Search" lang="en" aria-label="Cerca nella posta">
        <button type="button">VAI</button>
        <h2 lang="en">You have <span>30</span> unread</h2>
        <hr>
      </section>
      <main>
        <!-- lista email -->
        <div class="contenitore">
          <div class="email read">
            <div class="row_left">
              <input type="checkbox" aria-label="Seleziona la prima email">
              <span class="star" aria-hidden="true"></span>
              <span class="subject">Oggetto della email</span>
            </div>
            <div class="row_right">
            <span class="body">Corpo della email</span>
            </div>
          </div>
          <div class="email unread">
            <div class="row_left">
              <input type="checkbox" aria-label="Seleziona la seconda email">
              <span class="star" aria-hidden="true"></span>
              <span class="subject">Oggetto della email</span>
            </div>
            <div class="row_right">
            <span class="body">Corpo della email</span>
            </div>
          </div>

        </div>
        <hr>
      </main>
      <footer>
        <!-- crediti -->
        <span>GMail</span> powered by boolean
      </footer>
    </div>
  </body>
</html>
